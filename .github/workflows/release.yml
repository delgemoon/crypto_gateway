name: Release

on:
  push:
    tags:
      - 'v*'          # trigger on version tags: v1.0.0, v2.1.3, etc.
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write   # needed to create GitHub releases and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──────────────────────────────────────────────────────────
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_ext: .msi,.exe
            label: windows-x64

          # ── Linux ─────────────────────────────────────────────────────────────
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_ext: .deb,.rpm,.AppImage
            label: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install Linux system dependencies ─────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      # ── 3. Node.js ────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      # ── 4. Rust toolchain ─────────────────────────────────────────────────────
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── 5. Cache Rust build artifacts ─────────────────────────────────────────
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      # ── 6. Install frontend dependencies ─────────────────────────────────────
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      # ── 7. Build the Tauri app ────────────────────────────────────────────────
      # Windows code-signing (optional — set secrets in repo Settings → Secrets):
      #   TAURI_SIGNING_PRIVATE_KEY   — PEM private key
      #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — passphrase (can be empty)
      # macOS notarisation (optional):
      #   APPLE_CERTIFICATE           — base64-encoded .p12
      #   APPLE_CERTIFICATE_PASSWORD
      #   APPLE_SIGNING_IDENTITY      — "Developer ID Application: ..."
      #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID — for notarisation
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing / notarisation
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}       # e.g. v1.0.0
          releaseName: 'Order Dashboard ${{ github.ref_name }}'
          releaseBody: |
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true     # create as draft — publish manually after review
          prerelease: false
          args: --target ${{ matrix.target }}
